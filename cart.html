<!-- ================= CART - FIX CLOSE BUTTON ================= -->
<section class="cart" id="cart">
  <div class="cart-header">
    <h2>My Shopping Cart</h2>
    <!-- Nút đóng: không dùng onclick nữa, sẽ gán sự kiện bằng script -->
    <button id="cartClose" class="cart-close-btn">✕</button>
  </div>

  <div class="cart-content">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ttgiohang"></tbody>
    </table>
  </div>

  <div class="cart-footer">
    <div class="price-total">
      Total:
      <span>$0.00</span>
    </div>
    <button type="button" class="checkout-btn">Check Out</button>
  </div>
</section>

<style>
  /* CART CONTAINER */
  .cart {
    position: fixed;
    top: 0;
    right: -100%;
    width: 500px;
    max-width: 90vw;
    height: 100vh;
    background: #ffffff;
    z-index: 9999;
    box-shadow: -5px 0 20px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    transition: 0.4s ease;
  }

  .cart.active {
    right: 0;
  }

  /* HEADER */
  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid #ececec;
  }

  .cart-header h2 {
    font-size: 22px;
    font-weight: 600;
    color: #222;
    margin: 0;
  }

  .cart-close-btn {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: #555;
    line-height: 1;
    padding: 0 8px;
    transition: 0.2s;
  }
  .cart-close-btn:hover {
    color: #e03a3a;
    transform: scale(1.1);
  }

  /* CONTENT - BẢNG */
  .cart-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .cart-content table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 14px;
  }

  .cart-content th:nth-child(1),
  .cart-content td:nth-child(1) {
    width: 45%;
  }
  .cart-content th:nth-child(2),
  .cart-content td:nth-child(2) {
    width: 18%;
  }
  .cart-content th:nth-child(3),
  .cart-content td:nth-child(3) {
    width: 18%;
  }
  .cart-content th:nth-child(4),
  .cart-content td:nth-child(4) {
    width: 19%;
  }

  .cart-content th,
  .cart-content td {
    padding: 12px 8px;
    border-bottom: 1px solid #f2f2f2;
    vertical-align: top;
    word-break: break-word;
    overflow-wrap: break-word;
    line-height: 1.4;
  }

  .cart-content th {
    font-weight: 600;
    color: #444;
    white-space: nowrap;
  }

  .cart-content td:last-child {
    white-space: nowrap;
  }

  /* Sản phẩm: ảnh trên, tên dưới */
  .cart-product {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .cart-product img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .cart-product span {
    font-size: 13px;
    font-weight: 500;
    color: #222;
    line-height: 1.35;
    word-break: break-word;
    white-space: normal;
    display: block;
    max-width: 100%;
  }

  .cart-content input[type="number"] {
    width: 55px;
    height: 34px;
    border: 1px solid #ddd;
    text-align: center;
    outline: none;
    font-size: 14px;
    border-radius: 6px;
    padding: 0 4px;
  }

  .cart-delete {
    cursor: pointer;
    color: #ea5455;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: 0.2s;
    background: none;
    border: none;
  }
  .cart-delete:hover {
    color: #c82333;
    text-decoration: underline;
  }

  .cart-footer {
    padding: 18px 20px;
    border-top: 1px solid #ececec;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
  }
  .price-total {
    font-size: 18px;
    font-weight: 600;
    color: #222;
  }
  .price-total span {
    color: #c63b3b;
  }
  .checkout-btn {
    background: #222;
    color: white;
    border: none;
    padding: 10px 24px;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.2s;
  }
  .checkout-btn:hover {
    background: #3a3a3a;
  }

  @media screen and (max-width: 500px) {
    .cart {
      width: 100%;
    }
    .cart-content {
      padding: 12px;
    }
    .cart-content table {
      font-size: 12px;
    }
    .cart-content th,
    .cart-content td {
      padding: 10px 4px;
    }
    .cart-content td:last-child {
      white-space: normal;
    }
    .cart-product img {
      width: 50px;
      height: 50px;
    }
    .cart-product span {
      font-size: 11px;
    }
    .cart-content input[type="number"] {
      width: 48px;
      height: 30px;
    }
    .cart-delete {
      font-size: 11px;
    }
    .cart-content th {
      white-space: nowrap;
      font-size: 12px;
    }
  }
</style>

<script>
  // Hàm này sẽ chạy một lần duy nhất khi DOM đã sẵn sàng
  (function () {
    // Đợi DOM load
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initCart);
    } else {
      initCart();
    }

    function initCart() {
      var cart = document.getElementById("cart");
      var closeBtn = document.getElementById("cartClose");

      // Đóng giỏ hàng khi click nút X
      if (closeBtn && cart) {
        // Xóa tất cả các sự kiện cũ (nếu có) để tránh trùng lặp
        var newCloseBtn = closeBtn.cloneNode(true);
        closeBtn.parentNode.replaceChild(newCloseBtn, closeBtn);
        // Gắn sự kiện mới
        newCloseBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          cart.classList.remove("active");
          console.log("Cart closed"); // debug
        });
      }

      // Mở giỏ hàng khi click vào .cartbtn (nút CART trên header)
      var openBtns = document.querySelectorAll(".cartbtn");
      openBtns.forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          if (cart) cart.classList.add("active");
        });
      });
    }
  })();
</script>
