<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login & Register | INTERIOR</title>

    <!-- FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- BOXICONS -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <!-- ICON -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- w3.js -->
    <script src="https://www.w3schools.com/lib/w3.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
      }

      body {
        background: #f5f5f5;
        min-height: 100vh;
        /* Bù trừ chiều cao header fixed (khoảng 130px) */
        padding-top: 130px;
      }

      a {
        text-decoration: none;
      }

      /* WRAPPER */
      .wrapper {
        width: 100%;
        min-height: calc(100vh - 130px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      /* FORM BOX */
      .form-box {
        width: 500px;
        min-height: 580px;
        background: white;
        position: relative;
        overflow: hidden;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .form-container {
        width: 100%;
        transition: 0.4s ease;
      }

      .hidden {
        display: none;
      }

      .top {
        margin-bottom: 35px;
        text-align: center;
      }

      .top span {
        font-size: 14px;
        color: #666;
      }

      .top span a {
        color: #111;
        font-weight: 600;
      }

      .top h2 {
        margin-top: 10px;
        font-size: 32px;
        color: #111;
      }

      /* INPUT */
      .input-box {
        margin-bottom: 22px;
        position: relative;
      }

      .input-field {
        width: 100%;
        height: 52px;
        border: 1px solid #dcdcdc;
        padding: 0 45px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
        background: #fafafa;
      }

      .input-field:focus {
        border-color: #222;
        background: white;
      }

      .input-box i {
        position: absolute;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        color: #555;
        font-size: 18px;
      }

      /* TWO FORMS */
      .two-forms {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      /* SUBMIT */
      .submit {
        width: 100%;
        height: 50px;
        border: none;
        background: #222;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }

      .submit:hover {
        background: #444;
      }

      /* OPTIONS */
      .two-col {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
        font-size: 14px;
        color: #555;
      }

      .two-col label {
        cursor: pointer;
      }

      .two-col a {
        color: #111;
      }

      .two-col a:hover {
        text-decoration: underline;
      }

      .one {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* RESPONSIVE */
      @media screen and (max-width: 768px) {
        body {
          padding-top: 110px;
        }
        .form-box {
          width: 100%;
          max-width: 450px;
          padding: 30px 20px;
        }
        .two-forms {
          grid-template-columns: 1fr;
        }
      }

      @media screen and (max-width: 500px) {
        .top h2 {
          font-size: 28px;
        }
      }
    </style>
  </head>

  <body>
    <!-- INCLUDE HEADER (có cart, menu, logo...) -->
    <div w3-include-html="header.html"></div>

    <main class="wrapper">
      <div class="form-box">
        <!-- LOGIN -->
        <div class="form-container" id="loginForm">
          <div class="top">
            <span>
              Don't have an account?
              <a href="#" id="toRegister"> Sign up </a>
            </span>
            <h2>Sign In</h2>
          </div>

          <form id="loginFormElement">
            <div class="input-box">
              <input
                type="email"
                class="input-field"
                placeholder="Email"
                required
              />
              <i class="bx bx-envelope"></i>
            </div>

            <div class="input-box">
              <input
                type="password"
                class="input-field"
                placeholder="Password"
                required
              />
              <i class="bx bx-lock-alt"></i>
            </div>

            <div class="input-box">
              <button type="submit" class="submit">Sign In</button>
            </div>

            <div class="two-col">
              <div class="one">
                <input type="checkbox" id="remember" />
                <label for="remember"> Remember me </label>
              </div>
              <div>
                <a href="#"> Forgot password? </a>
              </div>
            </div>
          </form>
        </div>

        <!-- REGISTER -->
        <div class="form-container hidden" id="registerForm">
          <div class="top">
            <span>
              Already have an account?
              <a href="#" id="toLogin"> Sign in </a>
            </span>
            <h2>Sign Up</h2>
          </div>

          <form id="registerFormElement">
            <div class="two-forms">
              <div class="input-box">
                <input
                  type="text"
                  class="input-field"
                  placeholder="First Name"
                  required
                />
                <i class="bx bx-user"></i>
              </div>

              <div class="input-box">
                <input
                  type="text"
                  class="input-field"
                  placeholder="Last Name"
                  required
                />
                <i class="bx bx-user"></i>
              </div>
            </div>

            <div class="input-box">
              <input
                type="email"
                class="input-field"
                placeholder="Email"
                required
              />
              <i class="bx bx-envelope"></i>
            </div>

            <div class="input-box">
              <input
                type="password"
                class="input-field"
                placeholder="Password"
                required
              />
              <i class="bx bx-lock-alt"></i>
            </div>

            <div class="input-box">
              <button type="submit" class="submit">Sign Up</button>
            </div>

            <div class="two-col">
              <div class="one">
                <input type="checkbox" id="agree" required />
                <label for="agree"> Accept Terms </label>
              </div>
              <div>
                <a href="#"> Terms of Service </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- INCLUDE FOOTER -->
    <div w3-include-html="footer.html"></div>

    <script>
      w3.includeHTML(() => {
        // Chuyển đổi giữa Login và Register
        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const toRegister = document.getElementById("toRegister");
        const toLogin = document.getElementById("toLogin");

        function showLogin() {
          loginForm.classList.remove("hidden");
          registerForm.classList.add("hidden");
          if (loginBtn && registerBtn) {
            loginBtn.classList.add("white-btn");
            registerBtn.classList.remove("white-btn");
          }
        }

        function showRegister() {
          registerForm.classList.remove("hidden");
          loginForm.classList.add("hidden");
          if (registerBtn && loginBtn) {
            registerBtn.classList.add("white-btn");
            loginBtn.classList.remove("white-btn");
          }
        }

        if (loginBtn && registerBtn) {
          loginBtn.addEventListener("click", showLogin);
          registerBtn.addEventListener("click", showRegister);
        }
        if (toRegister)
          toRegister.addEventListener("click", (e) => {
            e.preventDefault();
            showRegister();
          });
        if (toLogin)
          toLogin.addEventListener("click", (e) => {
            e.preventDefault();
            showLogin();
          });
      });
    </script>
  </body>
</html>
